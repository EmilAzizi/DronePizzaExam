<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leveringer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .delivery {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            position: relative;
        }
        .delivery:not(:last-child)::after {
            content: "";
            display: block;
            height: 3px;
            background-color: red;
            margin-top: 20px;
        }
        .delivery h2 {
            margin: 0;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .form-container {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .form-container input {
            margin-right: 10px;
            padding: 5px;
            width: calc(100% - 140px);
        }
        .form-container button {
            padding: 5px 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .finish-button {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<h1>Leveringer</h1>

<div class="form-container">
    <input type="text" id="deliveryAddress" placeholder="Skriv hvilken pizza her..." />
    <button id="addDeliveryButton">Tilføj Levering</button>
</div>

<div id="deliveriesContainer">
    <!-- Leveringer tilføjes her dynamisk -->
</div>
<div class="error" id="errorMessage"></div>

<form action="/deliveries/queue" method="get">
    <button class="button" id="viewDeliveries">Se alle leveringer uden en drone</button>
</form>
<form action="/drones" method="get">
    <button type="submit">Tilbage</button>
</form>

<script>
    const deliveriesContainer = document.getElementById("deliveriesContainer");
    const errorMessage = document.getElementById("errorMessage");
    const addDeliveryButton = document.getElementById("addDeliveryButton");
    const deliveryAddressInput = document.getElementById("deliveryAddress");

    // Funktion til at hente leveringer
    async function fetchDeliveries() {
        try {
            const response = await fetch("/api/deliveries");
            if (!response.ok) {
                throw new Error("Kunne ikke hente leveringer.");
            }
            const deliveries = await response.json();
            renderDeliveries(deliveries);
        } catch (error) {
            errorMessage.textContent = error.message;
            console.error(error.message);
        }
    }

    // Funktion til at vise leveringer
    function renderDeliveries(deliveries) {
        deliveriesContainer.innerHTML = ""; // Tøm containeren
        deliveries.forEach(delivery => {
            const deliveryDiv = document.createElement("div");
            deliveryDiv.className = "delivery";
            deliveryDiv.innerHTML = `
                <h2>Levering ID: ${delivery.levering_ID}</h2>
                <p><strong>Status:</strong> ${delivery.status || "Ikke angivet"}</p>
                <p><strong>Adresse:</strong> ${delivery.adresse || "Ikke angivet"}</p>
                <p><strong>Forventet Levering:</strong> ${delivery.forventet_levering || "Ikke angivet"}</p>
                <p><strong>Faktisk Levering:</strong> ${delivery.faktisk_levering || "Ikke angivet"}</p>
                <button class="finish-button" data-id="${delivery.levering_ID}">Afslut Levering</button>
            `;
            deliveriesContainer.appendChild(deliveryDiv);
        });
    }

    // Funktion til at tilføje en levering
    async function addDelivery() {
        const address = deliveryAddressInput.value.trim();
        if (!address) {
            return;
        }

        try {
            const response = await fetch("/api/deliveries/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ adresse: address })
            });
            if (!response.ok) {
                throw new Error("Kunne ikke tilføje leveringen.");
            }
            deliveryAddressInput.value = ""; // Rens inputfeltet
            fetchDeliveries(); // Opdater listen efter tilføjelsen
        } catch (error) {
            errorMessage.textContent = error.message;
            console.error(error.message);
        }
    }

    // Funktion til at afslutte en levering
    async function finishDelivery(id) {
        try {
            const response = await fetch(`/api/deliveries/finish/${id}`, { method: "POST" });
            if (!response.ok) {
                throw new Error("Kunne ikke afslutte leveringen.");
            }
            fetchDeliveries(); // Opdater listen efter afslutningen
        } catch (error) {
            errorMessage.textContent = error.message;
            console.error(error.message);
        }
    }

    // Event listener for at afslutte en levering
    deliveriesContainer.addEventListener("click", (event) => {
        if (event.target.classList.contains("finish-button")) {
            const deliveryId = event.target.dataset.id;
            finishDelivery(deliveryId);
        }
    });

    // Event listener for at tilføje en levering
    addDeliveryButton.addEventListener("click", addDelivery);

    // Hent leveringer ved indlæsning af siden
    fetchDeliveries();
    setInterval(fetchDeliveries, 60000); // Opdater hver 60. sekund
</script>
</body>
</html>
