<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DronePizza Stationer og Leveringer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .station {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .station h2 {
            margin: 0;
            color: #333;
        }
        .drone-list {
            margin: 10px 0 0 20px;
            padding: 0;
            list-style-type: none;
        }
        .drone-list li {
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }
        .drone-list li:last-child {
            border-bottom: none;
        }
        .button {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .button:disabled {
            background-color: #CCCCCC;
            cursor: not-allowed;
        }
        .change-status-button {
            margin-left: 10px;
            background-color: #28a745;
        }
    </style>
</head>
<body>
<h1>Stationer og Droner</h1>
<div id="stationsContainer">
</div>
<button class="button" id="addDroneButton">Tilføj ny Drone</button>
<button class="button" id="viewDeliveries">Se alle leveringer</button>

<script>
    const stationsContainer = document.getElementById("stationsContainer");
    const addDroneButton = document.getElementById("addDroneButton");

    document.getElementById('viewDeliveries').addEventListener('click', function (){
       window.location.href = "deliveries";
    });
    async function fetchStations() {
        try {
            const response = await fetch("/api/stations");
            if (!response.ok) {
                throw new Error("Kunne ikke hente stationer.");
            }
            const stations = await response.json();
            renderStations(stations);
        } catch (error) {
            console.error(error.message);
        }
    }

    function renderStations(stations) {
        stationsContainer.innerHTML = "";
        stations.forEach(station => {
            const stationDiv = document.createElement("div");
            stationDiv.className = "station";

            const dronesHTML = station.drones.length
                ? station.drones.map(drone => `
                    <li>
                        Drone UUID: ${drone.serial_UUID} - Status: ${drone.driftStatus}
                        <button class="button change-status-button" data-drone-id="${drone.drone_ID}" data-action="enable">
                            Skift Driftstatus til "i drift"
                        </button>

                        <button class="button change-status-button" data-drone-id="${drone.drone_ID}" data-action="disable">
                            Skift Driftstatus til "ude af drift"
                        </button>

                        <button class="button change-status-button" data-drone-id="${drone.drone_ID}" data-action="retire">
                            Skift Driftstatus til "udfaset"
                        </button>
                    </li>
                `).join("")
                : "<li>Ingen droner</li>";

            stationDiv.innerHTML = `
                <h2>Station ${station.station_ID}</h2>
                <p>Koordinater: (${station.lat}, ${station.lon})</p>
                <p>Antal Droner: ${station.drones.length}</p>
                <ul class="drone-list">${dronesHTML}</ul>
            `;
            stationsContainer.appendChild(stationDiv);
        });
    }

    async function addDrone() {
        try {
            const response = await fetch("/api/drones/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    serial_UUID: crypto.randomUUID()
                })
            });
            if (!response.ok) {
                throw new Error("Kunne ikke tilføje ny drone.");
            }
            fetchStations();
        } catch (error) {
            console.error(error.message);
        }
    }

    document.addEventListener("click", async (event) => {
        if (event.target.classList.contains("change-status-button")) {
            const droneId = event.target.dataset.droneId;
            const action = event.target.dataset.action;

            const endpointMap = {
                enable: `/api/drones/enable/${droneId}`,
                disable: `/api/drones/disable/${droneId}`,
                retire: `/api/drones/retire/${droneId}`
            };

            if (endpointMap[action]) {
                try {
                    const response = await fetch(endpointMap[action], { method: "POST" });
                    if (!response.ok) {
                        throw new Error(`Kunne ikke ændre status til "${action}".`);
                    }
                    fetchStations();
                } catch (error) {
                    console.error(error.message);
                }
            } else {
                console.error(`Ukendt handling: ${action}`);
            }
        }
    });


    addDroneButton.addEventListener("click", addDrone);

    fetchStations();
    setInterval(fetchStations, 60000);
</script>
</body>
</html>
